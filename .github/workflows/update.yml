name: Update

# What stays here is what is genuinely this cache's own: when it runs, and what a manual dispatch
# can change. The gate against redundant queued runs, the runner's environment, the registry login,
# the image, the pipeline and the failure notification are all in the shared action.

permissions:
  contents: read
  packages: read

on:
  schedule:
    # GitHub delays and drops scheduled runs that fall on the hour, so this one runs at a minute of
    # its own. Every six hours, after both of the caches it sums in each window.
    - cron: "47 1-23/6 * * *"
  workflow_dispatch:
    inputs:
      testing:
        description: "Testing mode: write the result to testing_-prefixed files, leaving the real cache untouched. This cache does all of its work either way."
        required: false
        type: boolean
        default: false

# Serialize all runs across every ref: an in-progress update is never cancelled, and a run
# triggered while one is executing waits in the queue. The action then skips the queued run once it
# starts, because the update it would perform has just been done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  Update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # So a hung network read cannot burn a full six hours.
    timeout-minutes: 330
    steps:
      - uses: dandi-cache/dandi-cache-action@v6
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          testing: ${{ inputs.testing || false }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
